# Get the public IP address of an EC2 instance based on its name (which we have already defined with Terraform) and save it in a GitHub Actions environment variable.
# Use those public IP addresses stored in GitHub Actions environment variables to connect to the instances via SSH rather than using the 

name: Get EC2 Instance Public IP

on:
  push:
    branches:
      - main # Or your desired branch

jobs:
  get_ip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::ACCOUNT_ID:role/YOUR_GITHUB_ACTIONS_ROLE # Replace with your IAM role ARN
          aws-region: your-aws-region # Replace with your AWS region

      - name: Get EC2 Instance Public IP
        run: |
          EC2_INSTANCE_NAME="Your_EC2_Instance_Name"  # Replace with your EC2 instance name
          PUBLIC_IP=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=$EC2_INSTANCE_NAME" --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          echo "EC2_PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV

      - name: Use the Public IP
        run: |
          echo "The public IP of $EC2_INSTANCE_NAME is ${{ env.EC2_PUBLIC_IP }}"
          # You can now use ${{ env.EC2_PUBLIC_IP }} in subsequent steps

# Done, I think....





# Login to ECR
# Build and push Docker image to ECR
# My ECR name: 533327597913.dkr.ecr.us-east-1.amazonaws.com/dkfprojects/citibike-ecr-repo
# The ECR_REPOSITORY variable will need to be set 
# No need to copy to S3, just copy the docker-compose.yml to EC2 directly
# Still need to run SSH command
# Replace ${{ secrets.EC2_HOST }} with ${{ env.EC2_PUBLIC_IP }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Copy docker-compose file to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ec2-user/app"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/app
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            export ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
            export ECR_REPOSITORY=${{ env.ECR_REPOSITORY }}
            export IMAGE_TAG=${{ github.sha }}
            docker-compose down
            docker-compose pull
            docker-compose up -d